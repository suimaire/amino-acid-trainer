name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Read current shared visitor count (no write)
        shell: bash
        run: |
          echo "READ_ONLY_PAGE_VIEWS_RESULT_BEGIN"
          curl --silent --show-error --max-time 20 --request POST \
            --header 'Content-Type: application/json' \
            --header 'apikey: sb_publishable_bOM16W0j9Dh6U72M_fNp8Q_HwRZm9tF' \
            --data '{"p_page_key":"/amino-acid-trainer/"}' \
            'https://szbmpsvxzrnewyzqiokr.supabase.co/rest/v1/rpc/get_page_view_counts' || true
          echo
          echo "READ_ONLY_PAGE_VIEWS_RESULT_END"
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

