      content="표준 단백질성 아미노산 20종의 구조식, 이름, 3-letter code, 1-letter code를 익히는 학습 도구"

    <script>
      (function () {
        try {
          if (
            location.hostname !== 'suimaire.github.io' &&
            !new URLSearchParams(location.search).has('page-views')
          ) return;
          var script = document.createElement('script');
          script.type = 'module';
          script.src = 'https://suimaire.github.io/assets/js/page-views.js';
          document.head.appendChild(script);
        } catch (_) {
          // Counter problems must not affect the learning app.
        }
      })();
    </script>
